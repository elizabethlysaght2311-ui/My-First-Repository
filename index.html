<!DOCTYPE html> <html lang="en"> <head> <meta charset="utf-8" /> <title>Welcome — My First Repository</title> <meta name="viewport" content="width=device-width,initial-scale=1" /> <style> body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; max-width: 64rem; margin: 3rem auto; padding: 1.25rem; color:#222; } header { text-align:center; margin-bottom:1.5rem; } a.button { display:inline-block; margin-top:1rem; padding:0.5rem 0.9rem; background:#0366d6; color:white; text-decoration:none; border-radius:6px; } a.button:hover { background:#024fa3; } #readme { line-height:1.6; } #readme img { max-width:100%; height:auto; display:block; margin: 0.75rem 0; } </style> </head> <body> <header> <h1>Welcome!</h1> <p>I have created my first repository. Below is the README for this project.</p> <p><a class="button" href="https://github.com/elizabethlysaght2311-ui" target="_blank" rel="noopener">My GitHub profile</a></p> </header> <main id="readme">Loading README…</main> <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> <script> (async function () { const user = 'elizabethlysaght2311-ui'; const repo = 'My-First-Repository'; const branch = 'main'; const rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/${branch}/README.md`; try { let md = await fetch(rawUrl).then(r => { if (!r.ok) throw new Error('Unable to fetch README: ' + r.status); return r.text(); }); // Rewrite relative image/link paths to point to raw.githubusercontent so images load. // - replaces ![alt](path) and [text](path) when path is not absolute (doesn't start with http or /) const prefix = `https://raw.githubusercontent.com/${user}/${repo}/${branch}/`; md = md.replace(/(!?\[.*?\]\()(?!(?:https?:\/\/|\/|#))([^)\s]+)(\))/g, (m, p1, p2, p3) => { return p1 + prefix + p2 + p3; }); document.getElementById('readme').innerHTML = marked.parse(md); } catch (err) { document.getElementById('readme').textContent = 'Error loading README: ' + err.message; console.error(err); } })(); </script> </body> </html>
